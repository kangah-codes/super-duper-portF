{% extends 'base.html' %}

{% block title %}

<ul class="navbar-nav ml-auto">
  <li>
    <h1 class="h3 mb-2 text-gray-800" style="margin-top: 20px;float: right;">Education</h1>
  </li>
</ul>

{% endblock %}

<style type="text/css">
  h5{
    color: #222222
  }
</style>

{% block skill %}

<div class="container-fluid">
	<form method="post" enctype="multipart/form-data">
    <div class="form-row">
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Skill" name="skill" required>
      </div>
      
    </div>
    <div class="form-group">
      <label>Write the name of the linear icon which matches the skill you're adding</label>
        <input type="text" class="form-control" placeholder="Icon" name="icon" required>
      </div>
    <img src="{{ url_for('static', filename='img/icon-font.png') }}" style="width: 100%">

	<button type="submit" class="genric-btn primary-border circle arrow" style="margin-top: 30px;">Add skill<span class="lnr lnr-arrow-right"></span></button>
	</form>
	{% if msg == 'success' %}
      <div class="alert alert-success" role="alert" style="margin-top: 20px">
        Added experience successfully
      </div>
  {% elif msg == 'error' %}
  <div class="alert alert-danger" role="alert" style="margin-top: 20px">
    Error adding experience
  </div>
  {% endif %}


</div>

{% endblock %}
