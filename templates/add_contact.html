{% extends 'base.html' %}

{% block title %}

<ul class="navbar-nav ml-auto">
  <li>
    <h1 class="h3 mb-2 text-gray-800" style="margin-top: 20px;float: right;">Contact</h1>
  </li>
</ul>

{% endblock %}

{% block about %}

<div class="container-fluid">
	<form method="post">
		<div class="form-row">
          <div class="form-group">
          	<label>You must add only 3 contacts, (maybe 1 number & 2 emails or vice-versa)</label>
            <input type="text" class="form-control" placeholder="Contact" name="contact" required>
          </div>
        </div>
		<button type="submit" class="genric-btn primary-border circle arrow" style="margin-top: 30px;">Add contact<span class="lnr lnr-arrow-right"></span></button>
	</form>
	{% if msg == 'success' %}
        <div class="alert alert-success" role="alert" style="margin-top: 20px">
          Added about contact
        </div>
    {% elif msg == 'error' %}
    <div class="alert alert-danger" role="alert" style="margin-top: 20px; width: 30%">
      Error adding contact
    </div>
    {% endif %}
	
</div>

{% endblock %}
