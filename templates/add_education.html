{% extends 'base.html' %}

{% block title %}

<ul class="navbar-nav ml-auto">
  <li>
    <h1 class="h3 mb-2 text-gray-800" style="margin-top: 20px;float: right;">Education</h1>
  </li>
</ul>

{% endblock %}


{% block portfolio %}
<style type="text/css">
  h5{
    color: #222222
  }
</style>

<div class="container-fluid">
  <label>NB: Do this only once for shs and university</label>
	<form method="post" enctype="multipart/form-data">
      <label>Date started</label>
      <input type="number" required class="form-control" placeholder="Year Completed" name="start">
    <div class="form-group">
      <label>Date completed</label>
      <input type="number" required class="form-control" placeholder="Year Ended" name="end">
    </div>
    <div class="form-group">
      <input type="text" class="form-control" placeholder="Course" name="course" required>
    </div>
    <div class="form-group">
          <div class="single-element-widget">
              <div class="default-select" id="default-select">
                <select name='level'>
                  <option value="SHS">SHS</option>
                  <option value="University">University</option>
                </select>
              </div>
            </div>
        </div>
		
		<button type="submit" class="genric-btn primary-border circle arrow" style="margin-top: 30px;">Add education<span class="lnr lnr-arrow-right"></span></button>
	</form>
	{% if msg == 'success' %}
      <div class="alert alert-success" role="alert" style="margin-top: 20px">
        Added experience successfully
      </div>
  {% elif msg == 'error' %}
  <div class="alert alert-danger" role="alert" style="margin-top: 20px">
    Error adding experience
  </div>
  {% endif %}

</div>

{% endblock %}
